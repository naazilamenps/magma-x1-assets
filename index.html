<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="MAGMA X1 — Built for a rougher tomorrow." />
    <title>MAGMA X1</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <style>
      :root { color-scheme: dark; background: #1e1e1c; }
      *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { min-height: 100%; background: #1e1e1c; font-family: 'Inter', system-ui, sans-serif; }
      body { overflow-x: hidden; }
      .magma-scroll { height: 680vh; background: #1e1e1c; }
      .magma-sticky { position: sticky; top: 0; height: 100svh; overflow: hidden; isolation: isolate; background: #1e1e1c; }
      .sequence { position: absolute; inset: 0; width: 100%; height: 100%; display: block; z-index: 0; }
      .card-viewport { position: absolute; inset: 0; z-index: 1; overflow: hidden; pointer-events: none; }
      .card-track {
        position: absolute; top: clamp(84px, 20svh, 220px); left: 0;
        height: clamp(124px, 17.2vw, 254px); padding: 5px;
        border: 1px solid rgba(255, 255, 255, .10); border-radius: 5px;
        background: rgba(10, 11, 10, .72); box-shadow: 0 20px 50px rgba(0, 0, 0, .35);
        backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); will-change: transform;
      }
      .card-track img { display: block; width: auto; height: 100%; max-width: none; }
      .scroll-cue {
        position: absolute; z-index: 2; left: 50%; bottom: clamp(18px, 3svh, 34px);
        width: 20px; height: 32px; border: 1px solid rgba(255, 255, 255, .48); border-radius: 12px;
        transform: translateX(-50%); pointer-events: none; transition: opacity .25s ease;
      }
      .scroll-cue i {
        position: absolute; left: 50%; top: 7px; width: 2px; height: 6px;
        border-radius: 2px; background: #fff; transform: translateX(-50%);
        animation: magma-cue 1.5s ease-in-out infinite;
      }
      @keyframes magma-cue {
        0%, 100% { opacity: .35; transform: translate(-50%, 0); }
        55% { opacity: 1; transform: translate(-50%, 10px); }
      }
      @media (max-width: 700px) {
        .magma-scroll { height: 600vh; }
        .card-track { top: clamp(70px, 16svh, 126px); height: clamp(88px, 22vw, 142px); padding: 3px; }
      }
      @media (prefers-reduced-motion: reduce) {
        .magma-scroll { height: 100svh; }
        .scroll-cue i { animation: none; }
      }
    </style>
  </head>
  <body>
    <main class="magma-scroll" aria-label="MAGMA X1 product presentation">
      <section class="magma-sticky">
        <canvas class="sequence" aria-hidden="true"></canvas>
        <div class="card-viewport" aria-hidden="true">
          <div class="card-track">
            <img src="./assets/feature-cards.png" alt="" />
          </div>
        </div>
        <div class="scroll-cue" aria-hidden="true"><i></i></div>
      </section>
    </main>
    <script>
    (() => {
      const frameCount = 17;
      const framePath = (index) => `./assets/frames/ezgif-frame-${String(index + 1).padStart(3, "0")}.png`;
      const canvas = document.querySelector(".sequence");
      const ctx = canvas.getContext("2d", { alpha: false });
      const section = document.querySelector(".magma-scroll");
      const track = document.querySelector(".card-track");
      const cue = document.querySelector(".scroll-cue");
      const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
      const frames = Array.from({ length: frameCount }, () => new Image());
      let requestedFrame = -1, progress = 0, raf = 0;

      function loadFrame(index) {
        const image = frames[index];
        if (image.src) return;
        image.decoding = "async";
        image.src = framePath(index);
        image.onload = () => {
          if (index === 0 || index === Math.round(progress * (frameCount - 1))) requestRender();
        };
      }

      loadFrame(0);
      const loadRemaining = () => frames.forEach((_, index) => loadFrame(index));
      window.requestIdleCallback ? window.requestIdleCallback(loadRemaining, { timeout: 1200 }) : setTimeout(loadRemaining, 250);

      function sizeCanvas() {
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        const width = Math.round(window.innerWidth * dpr);
        const height = Math.round(window.innerHeight * dpr);
        if (canvas.width !== width || canvas.height !== height) {
          canvas.width = width; canvas.height = height; requestedFrame = -1;
        }
      }

      function draw(frameIndex) {
        const image = frames[frameIndex];
        if (!image.complete || !image.naturalWidth) return;
        const cw = canvas.width, ch = canvas.height;
        const scale = Math.max(cw / image.naturalWidth, ch / image.naturalHeight);
        const width = image.naturalWidth * scale, height = image.naturalHeight * scale;
        ctx.fillStyle = "#1e1e1c";
        ctx.fillRect(0, 0, cw, ch);
        ctx.drawImage(image, (cw - width) / 2, (ch - height) / 2, width, height);
        requestedFrame = frameIndex;
      }

      function update() {
        raf = 0; sizeCanvas();
        const bounds = section.getBoundingClientRect();
        const scrollDistance = Math.max(1, section.offsetHeight - window.innerHeight);
        const raw = Math.min(1, Math.max(0, -bounds.top / scrollDistance));
        progress = reduceMotion.matches ? 0 : Math.min(1, raw / .84);
        const frame = Math.round(progress * (frameCount - 1));
        loadFrame(frame);
        if (frame !== requestedFrame) draw(frame);
        cue.style.opacity = raw > .035 ? "0" : "1";
        const start = window.innerWidth * 1.04;
        const end = -track.offsetWidth - window.innerWidth * .04;
        track.style.transform = `translate3d(${start + (end - start) * progress}px, 0, 0)`;
      }

      function requestRender() { if (!raf) raf = requestAnimationFrame(update); }
      window.addEventListener("scroll", requestRender, { passive: true });
      window.addEventListener("resize", requestRender, { passive: true });
      reduceMotion.addEventListener?.("change", requestRender);
      requestRender();
    })();
    </script>
  </body>
</html>
